<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ What's for Dinner?</title>
  <style>
    /* ── Page Layout ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      color: #fff;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.65;
      margin-bottom: 32px;
    }

    /* ── Wheel Container ── */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .wheel-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
    }

    /* The little arrow pointer at the top */
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #f5c518;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      z-index: 10;
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 6px rgba(255,255,255,0.08);
      display: block;
    }

    /* Spin button */
    #spinBtn {
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f5c518, #e0a800);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245,197,24,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.5px;
    }

    #spinBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,197,24,0.55); }
    #spinBtn:active { transform: translateY(0); }
    #spinBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Result banner */
    #result {
      min-height: 56px;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 12px 28px;
      opacity: 0;
      transition: opacity 0.4s;
      max-width: 380px;
    }

    #result.show { opacity: 1; }

    /* ── Dinner List Editor ── */
    .editor {
      margin-top: 40px;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 24px;
    }

    .editor h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      opacity: 0.85;
    }

    /* Individual dinner item rows */
    .dinner-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .dinner-item span {
      flex: 1;
      font-size: 0.95rem;
      padding: 6px 10px;
      background: rgba(255,255,255,0.07);
      border-radius: 8px;
    }

    .remove-btn {
      background: rgba(255, 80, 80, 0.25);
      border: none;
      color: #ff8080;
      font-size: 1.1rem;
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .remove-btn:hover { background: rgba(255,80,80,0.45); }

    /* Add new dinner input */
    .add-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    #newDinner {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    #newDinner::placeholder { color: rgba(255,255,255,0.4); }
    #newDinner:focus { border-color: #f5c518; }

    #addBtn {
      padding: 10px 18px;
      background: linear-gradient(135deg, #f5c518, #e0a800);
      color: #1a1a2e;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.1s;
    }
    #addBtn:hover { transform: translateY(-1px); }

    .tip {
      margin-top: 14px;
      font-size: 0.78rem;
      opacity: 0.4;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🍽️ What's for Dinner?</h1>
  <p class="subtitle">Spin the wheel and let fate decide!</p>

  <div class="wheel-section">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="380" height="380"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">🎰 Spin!</button>

    <div id="result"></div>
  </div>

  <!-- Dinner List Editor -->
  <div class="editor">
    <h2>🥘 Customize Your Dinners</h2>
    <div id="dinnerList"></div>
    <div class="add-row">
      <input id="newDinner" type="text" placeholder="Add a dinner…" maxlength="40"
             onkeydown="if(event.key==='Enter') addDinner()" />
      <button id="addBtn" onclick="addDinner()">Add</button>
    </div>
    <p class="tip">You need at least 2 dinners to spin.</p>
  </div>

  <script>
    // ─────────────────────────────────────────
    //  DATA  –  Edit these to change defaults!
    // ─────────────────────────────────────────
    let dinners = [
      "🍕 Pizza",
      "🍣 Sushi",
      "🍔 Burgers",
      "🌮 Tacos",
      "🍝 Pasta",
      "🥗 Salad",
      "🍜 Ramen",
      "🍗 Chicken",
      "🥩 Steak",
      "🥘 Curry"
    ];

    // ─────────────────────────────────────────
    //  WHEEL COLORS
    // ─────────────────────────────────────────
    const COLORS = [
      "#e63946", "#457b9d", "#2a9d8f", "#e9c46a",
      "#f4a261", "#264653", "#a8dadc", "#6a4c93",
      "#ff6b6b", "#48cae4"
    ];

    // ─────────────────────────────────────────
    //  CANVAS SETUP
    // ─────────────────────────────────────────
    const canvas  = document.getElementById("wheelCanvas");
    const ctx     = canvas.getContext("2d");
    const cx      = canvas.width  / 2;
    const cy      = canvas.height / 2;
    const radius  = cx - 8;

    let currentAngle = 0;   // current rotation of the wheel (radians)
    let isSpinning   = false;

    // ─────────────────────────────────────────
    //  DRAW THE WHEEL
    // ─────────────────────────────────────────
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sliceAngle = (2 * Math.PI) / dinners.length;

      dinners.forEach((dinner, i) => {
        const startAngle = currentAngle + i * sliceAngle;
        const endAngle   = startAngle + sliceAngle;

        // Draw slice
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw label text
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + sliceAngle / 2);

        // How far from center to draw text
        const textRadius = radius * 0.62;
        ctx.textAlign    = "right";
        ctx.fillStyle    = "#fff";
        ctx.font         = `bold ${fontSize(dinner)}px Segoe UI, sans-serif`;
        ctx.shadowColor  = "rgba(0,0,0,0.6)";
        ctx.shadowBlur   = 4;

        // Clip text so it doesn't overflow the slice
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 4, -sliceAngle/2, sliceAngle/2);
        ctx.closePath();
        ctx.clip();

        ctx.fillText(dinner, textRadius, 5);
        ctx.restore();
      });

      // Centre circle
      ctx.beginPath();
      ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
      ctx.fillStyle   = "#fff";
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur  = 8;
      ctx.fill();
      ctx.shadowBlur  = 0;
    }

    // Pick a font size that fits shorter or longer names
    function fontSize(text) {
      if (text.length > 16) return 11;
      if (text.length > 10) return 13;
      return 15;
    }

    // ─────────────────────────────────────────
    //  SPIN LOGIC
    // ─────────────────────────────────────────
    function spinWheel() {
      if (isSpinning || dinners.length < 2) return;

      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      // Hide old result
      const resultEl = document.getElementById("result");
      resultEl.classList.remove("show");
      resultEl.textContent = "";

      // Random spin: 5–10 full rotations + random extra
      const extraSpins = (5 + Math.random() * 5) * 2 * Math.PI;
      const randomExtra = Math.random() * 2 * Math.PI;
      const totalSpin   = extraSpins + randomExtra;

      const duration  = 4000 + Math.random() * 1500; // 4–5.5 seconds
      const startTime = performance.now();
      const startAngle = currentAngle;

      function animate(now) {
        const elapsed  = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Ease-out cubic – starts fast, slows to a stop
        const eased = 1 - Math.pow(1 - progress, 3);

        currentAngle = startAngle + totalSpin * eased;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // Spin done – figure out which slice is at the top (pointer)
          isSpinning = false;
          document.getElementById("spinBtn").disabled = false;
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    // Work out which dinner the pointer (top = -PI/2) is pointing at
    function showResult() {
      const sliceAngle  = (2 * Math.PI) / dinners.length;
      // Normalize angle to 0–2π
      const normalized  = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      // The pointer is at the top (angle = -π/2 from canvas 0). Translate:
      const pointerAngle = ((-Math.PI / 2) - normalized + 4 * Math.PI) % (2 * Math.PI);
      const index = Math.floor(pointerAngle / sliceAngle) % dinners.length;

      const winner = dinners[index];
      const resultEl = document.getElementById("result");
      resultEl.textContent = `Tonight: ${winner}`;
      resultEl.classList.add("show");
    }

    // ─────────────────────────────────────────
    //  DINNER LIST UI
    // ─────────────────────────────────────────
    function renderList() {
      const listEl = document.getElementById("dinnerList");
      listEl.innerHTML = "";

      dinners.forEach((dinner, i) => {
        const row = document.createElement("div");
        row.className = "dinner-item";

        const label = document.createElement("span");
        label.textContent = dinner;

        const btn = document.createElement("button");
        btn.className = "remove-btn";
        btn.textContent = "×";
        btn.title = "Remove";
        btn.onclick = () => removeDinner(i);

        row.appendChild(label);
        row.appendChild(btn);
        listEl.appendChild(row);
      });

      drawWheel();
    }

    function addDinner() {
      const input = document.getElementById("newDinner");
      const val   = input.value.trim();
      if (!val) return;
      dinners.push(val);
      input.value = "";
      renderList();
    }

    function removeDinner(index) {
      if (dinners.length <= 2) {
        alert("You need at least 2 dinners on the wheel!");
        return;
      }
      dinners.splice(index, 1);
      renderList();
    }

    // ─────────────────────────────────────────
    //  INIT
    // ─────────────────────────────────────────
    renderList();
  </script>

</body>
</html>
